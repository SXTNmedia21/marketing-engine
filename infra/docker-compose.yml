name: marketing-engine

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, internal]
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketing_engine
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  twenty-server:
    build:
      context: ../../marketing-engine-vendor/twenty
      dockerfile: packages/twenty-docker/twenty/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PG_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/twenty
      SERVER_URL: ${TWENTY_SERVER_URL}
      APP_SECRET: ${TWENTY_APP_SECRET}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "false"
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage
    networks: [internal]
    logging: *default-logging

  twenty-worker:
    build:
      context: ../../marketing-engine-vendor/twenty
      dockerfile: packages/twenty-docker/twenty/Dockerfile
    restart: unless-stopped
    depends_on:
      twenty-server: { condition: service_started }
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/twenty
      APP_SECRET: ${TWENTY_APP_SECRET}
      STORAGE_TYPE: local
    networks: [internal]
    logging: *default-logging

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      GENERIC_TIMEZONE: Europe/Oslo
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [internal]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]
    logging: *default-logging

  postiz:
    build:
      context: ../../marketing-engine-vendor/postiz-app
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postiz
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      MAIN_URL: ${POSTIZ_MAIN_URL}
      FRONTEND_URL: ${POSTIZ_MAIN_URL}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_MAIN_URL}/api
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
    volumes:
      - postiz_uploads:/uploads
    networks: [internal]
    logging: *default-logging

  control-api:
    build:
      context: ../
      dockerfile: apps/control-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/marketing_engine
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN}
      TWENTY_API_URL: http://twenty-server:3000
      TWENTY_API_TOKEN: ${TWENTY_API_TOKEN}
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
    networks: [internal]
    logging: *default-logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [internal]
    logging: *default-logging

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [internal]
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on: [loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    logging: *default-logging

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  twenty_server_data:
  n8n_data:
  redis_data:
  postiz_uploads:
  minio_data:
  loki_data:
  grafana_data:
